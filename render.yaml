# -------------------------------------------------------------------
# Render blueprint for Innovation Window India
# Two services:
#   • iwi-backend  — FastAPI web service (Python)
#   • iwi-frontend — Built React SPA served as a static site
# -------------------------------------------------------------------
services:
  # ---------------- Backend ----------------
  - type: web
    name: iwi-backend
    runtime: python
    plan: free
    region: singapore                # closest to India on Render free tier
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      # ---- Secrets — set the actual values in the Render dashboard ----
      - key: MONGO_URL                 # Atlas SRV URI
        sync: false
      - key: DB_NAME
        value: innovation_window_india
      - key: JWT_SECRET                # generate with: python -c "import secrets;print(secrets.token_hex(32))"
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@innovationwindowindia.com
      - key: ADMIN_PASSWORD            # rotate after first login
        sync: false
      - key: RAZORPAY_ENABLED             # "true" to re-enable Razorpay; sellers use QR-code payments while unset/false
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_URL              # cloudinary.com dashboard → "API Environment variable"
        sync: false
      - key: TWILIO_ACCOUNT_SID           # twilio.com console → Account Info. Optional: powers WhatsApp payment confirmations.
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM         # e.g. "whatsapp:+14155238886" (Twilio's sandbox number while testing)
        sync: false
      - key: ADMIN_WHATSAPP_NUMBERS       # comma-separated E.164 numbers, e.g. "+919876543210,+919812345678"
        sync: false                       # notified on new seller signups + pending products; approval stays in the dashboard

      # ---- App config ----
      - key: FRONTEND_URL
        value: https://innovationwindowindia.com
      - key: CORS_ORIGINS
        value: https://iwi-frontend.onrender.com,https://innovationwindowindia.com,https://www.innovationwindowindia.com
      - key: FLAT_SHIPPING_FEE
        value: "49"
      - key: FREE_SHIPPING_THRESHOLD
        value: "799"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        # Cross-origin frontend (Render subdomain) needs SameSite=none. Switch to
        # "lax" once the frontend & backend share the same site (e.g. after DNS
        # points innovationwindowindia.com at both services).
        value: none

      # ---- SMTP (Gmail) for password reset emails ----
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_FROM_NAME
        value: Innovation Window India
      - key: SMTP_USER              # your Gmail address (e.g. name@gmail.com)
        sync: false
      - key: SMTP_APP_PASSWORD      # Google App Password: myaccount.google.com/apppasswords
        sync: false
      - key: SMTP_FROM_EMAIL        # optional: defaults to SMTP_USER if unset
        sync: false

  # ---------------- Frontend (static) ----------------
  - type: web
    name: iwi-frontend
    runtime: static
    rootDir: frontend
    # The app relies on yarn's `resolutions` field to pin transitive deps that
    # npm's flat resolver mishandles (ajv/ajv-keywords collision from react-scripts).
    # Enable corepack (bundled with Node 20) so `yarn` is available, then build.
    buildCommand: "corepack enable && corepack prepare yarn@1.22.22 --activate && yarn install --network-timeout 300000 && yarn build"
    staticPublishPath: build
    autoDeploy: true
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: REACT_APP_BACKEND_URL
        # Full URL required (fromService.property: host omits the scheme,
        # producing a broken relative URL at build time).
        value: https://iwi-backend.onrender.com
      - key: GENERATE_SOURCEMAP
        value: "false"
      - key: DISABLE_ESLINT_PLUGIN
        value: "true"
    routes:
      - type: rewrite                  # React Router SPA fallback
        source: /*
        destination: /index.html
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
